notes: |
  Released 2026-05-27 — uwsm-adoption archived (session-management capability complete).
  Blocked-by constraint lifted.

  Slice A complete on bare-metal — Pillbox edge-to-edge shell shipped (REQ-BS-01..05 satisfied).
  Runtime smoke test PASSED on bare-metal CachyOS host:
    - Single full-width BarShell renders edge-to-edge
    - Workspaces dot/pill morph centered + functional (click + scroll dispatch)
    - Hyprland compositor blur visible behind bar (hl.layer_rule)
    - No CSS errors in stderr (/tmp/ags-debug.log empty after fixes)
    - Mic widget visible (its full restyle is REQ-MC-* in Slice B)
    - Placeholders 'vol/bat/net/bell' render as expected (Slices B/C/D will replace)

  Slice A required 5 post-apply fixes:
    1. b7d6d1e — flatten Workspaces binding (nested Accessor → createComputed)
    2. b7d6d1e — drop bar-shell max-height (clipped 44px a11y hit zone)
    3. bf28224 / c0f0c1c — hyprland layer_rule field is ignore_alpha (not ignorezero)
    4. bcc5a66 — GTK4 CSS subset: replaced :root + [data-theme=...] with *;
                  removed display:flex/align-items/justify-content; dropped !important
    5. bcc5a66 — Workspaces uses <For> from gnim (not .as(arr => arr.map(...)))
    6. 53d9b28 — center inner dot/pill box halign/valign to prevent vertical stretch

  Task 1.22 (gsettings animations off motion-off check) deferred to verify phase.

  Slice B complete on bare-metal — Clock+Calendar, ActiveWindow, LauncherPill, Mic+Launcher
  restyle. Runtime smoke PASSED after 5 post-apply fixes:
    1. 48d7ca5 — LauncherPill rendered empty (label=""); swap to <image iconName="view-app-grid-symbolic"/>
    2. 1c8845d — <calendar> is not a gnim JSX intrinsic; build Gtk.Calendar imperatively via box.$={...}
    3. 1c8845d — GTK4 CSS has no max-width property; clamp via Pango ellipsize + maxWidthChars on label
    4. 1c8845d — Hyprland `hyprctl -j workspaces` returns only existing workspaces; render fixed 1..5 + extras + active
    5. bee0d6d — LauncherPill set_size_request(44,44) + min-height/min-width 44px stretched bar; drop both, padding only
    6. bee0d6d — Reorder Bar.tsx left section: LauncherPill → Workspaces → ActiveWindow (user requested far-left position)
    7. 9bdb06e — Hyprland Lua config: `hyprctl dispatch workspace N` legacy form fails (eval'd as invalid Lua);
                 replaced with focusWorkspace(target) wrapping `hl.dsp.focus({workspace=N})` Lua API

  Slice B confirmed working:
    - Workspaces 1..5 visible, active pill morphs, click switches workspace, scroll cycles
    - LauncherPill icon visible at far-left, click opens launcher
    - ActiveWindow updates on focus, truncates with ellipsis
    - Clock shows HH:MM + date, click toggles Calendar popover (GTK4 calendar widget appears)
    - Stderr clean (no CSS / JSX intrinsic errors)

  Slice C complete on bare-metal — Volume/Battery/Network smoke PASSED. Fixes:
    - 35961f7 Network icon derived from Wifi/Wired sub-object (Network has no icon-name)
    - 6f0df90 Volume hides % when muted
    - 4958bc2 Volume redesign: icon-only chip + transient % popover OSD on scroll
    - 52d5768 Centered macOS-style OSD on volume KEYS via `ags request volume-osd`
  Battery hidden on desktop (isBattery=false) confirmed working.

  Slice D complete on bare-metal — notifd cutover smoke PASSED. Fixes:
    - swaync (pid 3433) had to be killed by hand once; autostart removed so it stays dead
    - 90d1fc4 bell uses existing symbolic icons (preferences-system-notifications / notifications-disabled)
    - 2105693 design pass: opaque popover (--mantle-glass), dot badge (no number)
    - a345449 Clear all stays visible+disabled when empty; more panel space; mono retained
  Notification design decisions (per user): monospace kept (DESIGN.md §1.2 identity);
  unread = red presence dot (no count); Clear all grays out instead of disappearing.

  ALL APPLY SLICES COMPLETE. Apply phase done.

  Next steps:
    1. sdd-verify desktop-redesign — validate 4 slices vs specs/design/tasks.
       Includes deferred manual checks: task 1.22 (gsettings animations off → motion-off),
       task 3.5 (a11y audit: accessible-name/role/44px on all interactive widgets),
       task 3.6 (contrast ≥4.5:1 spot check).
    2. sdd-archive desktop-redesign — merge delta specs to openspec/specs/, close cycle.

