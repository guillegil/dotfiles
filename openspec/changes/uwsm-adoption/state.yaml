notes: |
  Planning artifacts written on the VirtualBox VM session before the
  user's migration to bare-metal CachyOS. Apply was DELIBERATELY skipped
  on the VM because:
    - VBox virtio-gpu has applyCommit issues with aquamarine that would
      mask any uwsm-related modeset behavior.
    - SDDM session selection on the VM is irrelevant — the user is moving
      to a new install.
    - uwsm session lifecycle (logout/login + service activation timing)
      must be tested on the real target host.
  The bare-metal agent should:
    1. Clone the repo on the new CachyOS install.
    2. Run sdd-init to refresh skill registry + project context.
    3. Run sdd-apply uwsm-adoption — follows tasks.md 1.1..6.x in order.
    4. Run sdd-verify uwsm-adoption against specs.md.
    5. Run sdd-archive uwsm-adoption.
    6. THEN resume desktop-redesign starting at Slice A.

  Fix applied after runtime verification found CRITICAL drop-in bug
  (commit 9e2538d): the original [Autologin]-only drop-in was ignored by
  SDDM for manual login. Corrected to two-section form with [General]
  DefaultSession= (greeter preselection) + [Autologin] Session= (autologin
  fallback). User must re-run install.sh to upgrade the existing drop-in,
  then re-check 5.1 (SDDM greeter preselection) and 5.10 (drop-in content).
