# Session-level env vars injected by systemd user generator before the Hyprland
# session starts. Hyprland reads its own env at process launch (hl.env() only
# affects child processes), so anything that needs to be set BEFORE Hyprland
# starts must live here.

# AQ_NO_MODIFIERS: tell aquamarine (Hyprland's DRM backend) to skip explicit
# DRM format modifiers. The vmwgfx driver (used by VirtualBox VMSVGA) doesn't
# expose modifiers cleanly, which makes aquamarine fail `applyCommit` on any
# scanout buffer other than the preferred mode. Forcing no-modifiers lets
# vmwgfx accept arbitrary resolutions (so VirtualBox window resize / View ->
# Virtual Screen 1 -> <resolution> actually applies).
# Harmless on bare-metal — modern GPUs ignore the variable.
AQ_NO_MODIFIERS=1
