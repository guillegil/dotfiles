# hyprpaper — wallpaper daemon config.
# Replace wallpaper.png with your own image (same path) to change the wallpaper;
# this default is a subtle Catppuccin Mocha radial vignette.
# Docs: https://wiki.hypr.land/Hypr-Ecosystem/hyprpaper/

preload = ~/.config/hypr/wallpaper.png

# Empty monitor field = apply to all outputs.
wallpaper = ,~/.config/hypr/wallpaper.png

splash = false
ipc = off
