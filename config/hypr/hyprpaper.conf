# hyprpaper — v0.8+ block config syntax (the old flat
# "preload =" / "wallpaper = monitor,path" form is silently ignored now).
# Replace ~/.config/hypr/wallpaper.jpg with your own image to change it.
# wallpaper.jpg is gitignored (per-machine). Path is absolute — this build does
# not reliably expand ~.

wallpaper {
    monitor =
    path = /home/guille/.config/hypr/wallpaper.jpg
    fit_mode = cover
}
