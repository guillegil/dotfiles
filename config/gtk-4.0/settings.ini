[Settings]
# Force GTK4 to render dark. AGS/Astal widgets paint their own dark surfaces,
# but native widget surfaces (Gtk.Popover background/arrow, Gtk.Calendar,
# menus, tooltips, scrollbars) follow the GTK theme — without this they fall
# back to Adwaita light (white) when libadwaita / a dark color-scheme source
# is absent. Set explicitly so the desktop is dark regardless of installed deps.
gtk-application-prefer-dark-theme=true
